[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is deliberately unset: migrations/env.py takes the app's
# SQLALCHEMY_DATABASE_URI (SECRET_KEY, BASE_URL and DATABASE_URL from the
# environment). Programmatic callers may set it with Config.set_main_option.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

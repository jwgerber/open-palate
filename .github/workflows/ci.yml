name: CI
# Pull requests and pushes to main. Branch pushes without a PR don't run,
# so each change is tested once, not twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_palate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: pytest -q
        env:
          DATABASE_URL: sqlite:////tmp/ci.db
      - name: Tests on Postgres
        run: pytest -q
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_palate_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_palate_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  # Builds the image the Image workflow would publish (amd64 only; that
  # workflow adds arm64) and runs it the way the README does.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: open-palate:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: scripts/docker-smoke.sh open-palate:smoke

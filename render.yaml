# Render blueprint. The image is pulled from GHCR; set `image.url` to your
# published tag, and add registry credentials in the Render dashboard while the
# package is private.
services:
  - type: web
    name: open-palate
    runtime: image
    image:
      url: ghcr.io/OWNER/open-palate:latest
    plan: starter        # a disk needs a paid instance (about $7/month plus $0.25/GB disk)
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false      # prompted on deploy, e.g. https://open-palate.onrender.com
